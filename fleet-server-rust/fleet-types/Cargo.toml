[package]
name = "fleet-types"
version = "0.1.0"
edition = "2021"
description = "Core data types for Fleet server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"], optional = true }
thiserror = "2"
async-trait = "0.1"

[features]
default = []
db = ["sqlx"]
