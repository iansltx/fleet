[package]
name = "fleet-datastore"
version = "0.1.0"
edition = "2021"
description = "MySQL datastore layer for Fleet server"

[dependencies]
fleet-types = { path = "../fleet-types", features = ["db"] }
fleet-service = { path = "../fleet-service" }

# Async runtime
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }
rand = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Async traits
async-trait = { workspace = true }
